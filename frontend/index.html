<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>ShopCo - Premium E-commerce Store</title>
    <meta name="description" content="Discover premium products at ShopCo. Fast delivery, secure Razorpay payments, and Gmail-verified accounts. Shop streetwear, luxury, and minimalist fashion." />

    <!-- Open Graph (WhatsApp, LinkedIn, Twitter preview) -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Discover premium products at ShopCo. Fast delivery, secure Razorpay payments." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
